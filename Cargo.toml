[package]
name = "observable-cafe"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/sagikazarmark/observable-cafe"
publish = false

[dependencies]
chrono = "0.4"
dioxus = { version = "0.7", features = ["fullstack", "router"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.126"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive", "env"], optional = true }
figment = { version = "0.10", features = ["env", "toml"], optional = true }
futures-timer = "3"
tokio = { version = "1", features = ["rt", "time"], optional = true }

# `Jail` gives one test its own directory and environment without disturbing
# the rest, which the configuration tests need and the café itself does not.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
figment = { version = "0.10", features = ["env", "toml", "test"] }

[features]
default = ["web"]
server = ["dep:clap", "dep:figment", "dep:tokio", "dioxus/server"]
web = ["dioxus/web"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = true
features = ["server"]

[package.metadata.release]
sign-commit = true
sign-tag = true
tag-message = "Release {{version}}"
tag-prefix = ""
